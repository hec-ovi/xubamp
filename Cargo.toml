[workspace]
resolver = "2"
members = ["crates/skin", "crates/render", "crates/wl", "crates/audio", "crates/dsp", "crates/config", "crates/library", "crates/portal", "crates/xubamp"]

# Symphonia's MP3 decoder drops any frame with a digitally silent granule and then cascades that
# failure to the end of the track, so intros, fades, and whole tail sections go missing. The
# vendored copy is upstream 0.5.5 plus one hunk; see vendor/symphonia-bundle-mp3/PATCHES.md.
[patch.crates-io]
symphonia-bundle-mp3 = { path = "vendor/symphonia-bundle-mp3" }

[workspace.package]
version = "0.2.10"
edition = "2021"
rust-version = "1.96"
license = "GPL-2.0-or-later"
repository = "https://github.com/hec-ovi/xubamp"
authors = ["Hector Oviedo"]

# Lean, fast release binary: full LTO, one codegen unit, abort on panic
# (drops unwinding tables), symbols stripped.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
